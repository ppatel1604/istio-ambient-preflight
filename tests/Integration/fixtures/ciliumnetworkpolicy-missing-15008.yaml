# Single CiliumNetworkPolicy that fires BOTH C-01 and C-02 in the
# ambient-labeled 'payments' namespace:
#
#   * C-02: ingress allows only TCP/8080, omitting the ztunnel HBONE
#           path on TCP/15008. Mesh traffic to the destination pod will
#           silently be dropped after migration.
#   * C-01: 'fromEndpoints' restricts source by 'app=frontend', a
#           pre-ambient pod selector. After migration the source on the
#           connection is the waypoint pod's identity, not the original
#           client, so this rule no longer matches mesh traffic.
#
# Requires the Cilium CNP CRD to be installed in the cluster -- see
# setup-fixtures.sh in this directory.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: pod-only-no-15008
  namespace: payments
spec:
  endpointSelector:
    matchLabels:
      app: backend
  ingress:
    - fromEndpoints:
        - matchLabels:
            app: frontend
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
