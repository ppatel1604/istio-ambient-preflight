# Namespaces designed to exercise N-01, N-02, and C-02.
#
# demo-app     : ambient-labeled, correctly enrolled. Used as the parent
#                namespace for the non-compliant CiliumNetworkPolicy that
#                triggers C-02.
# half-migrated: labeled for BOTH istio-injection=enabled and
#                istio.io/dataplane-mode=ambient. Triggers N-02 (Blocker).
# legacy       : no dataplane-mode label at all. Triggers N-01 (Warning).
---
apiVersion: v1
kind: Namespace
metadata:
  name: demo-app
  labels:
    istio.io/dataplane-mode: ambient
---
apiVersion: v1
kind: Namespace
metadata:
  name: half-migrated
  labels:
    istio-injection: enabled
    istio.io/dataplane-mode: ambient
---
apiVersion: v1
kind: Namespace
metadata:
  name: legacy
