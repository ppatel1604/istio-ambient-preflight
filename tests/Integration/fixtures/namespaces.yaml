# Fixture namespaces for the enriched preflight demo.
#
# payments         : ambient-labeled. Hosts the P-01 / C-01 / C-02
#                    fixtures that exercise pod-level and Cilium-policy
#                    checks.
# legacy-injection : labeled BOTH istio-injection=enabled AND
#                    istio.io/dataplane-mode=ambient -- fires N-02
#                    (Blocker). Its pods also fire P-02 because the
#                    namespace label combination is the trigger.
# unlabeled-app    : no dataplane-mode label at all -- fires N-01
#                    (Warning).
---
apiVersion: v1
kind: Namespace
metadata:
  name: payments
  labels:
    istio.io/dataplane-mode: ambient
---
apiVersion: v1
kind: Namespace
metadata:
  name: legacy-injection
  labels:
    istio-injection: enabled
    istio.io/dataplane-mode: ambient
---
apiVersion: v1
kind: Namespace
metadata:
  name: unlabeled-app
